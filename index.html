<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aditya Birla Sun Life Insurance workspace booking." />
    <title>ABSLI Workspace Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="banner.css" />
  </head>
  <body>
    <div class="app-shell">
      <main>
        <section class="booking-banner">
          <div class="banner-title"><h1>ABSLI Meeting Room Booking</h1></div>
          <button class="banner-button" id="openBookingBtn" type="button"><span>+</span> New booking</button>
        </section>

        <section class="controls-card" aria-label="Availability controls">
          <div class="date-control">
            <label for="selectedDate">Choose date</label>
            <div class="input-shell"><span class="calendar-icon">□</span><input id="selectedDate" type="date" /></div>
          </div>
          <div class="divider"></div>
          <div class="date-summary" id="dateSummary"></div>
          <div class="legend">
            <span><i class="available-dot"></i>Free</span>
            <span><i class="booked-dot"></i>Booked</span>
          </div>
        </section>

        <section class="schedule-section">
          <div class="section-heading">
            <div><h2>Room schedule</h2></div>
            <p class="slots-note">Select a free time to book</p>
          </div>
          <div class="schedule-wrap">
            <div class="timeline" id="timeline" aria-label="Room availability timeline"></div>
          </div>
        </section>

        <section class="reservations-section">
          <div class="section-heading reservations-heading">
            <div><h2>My bookings</h2></div>
            <div class="filter-controls">
              <select id="roomFilter" aria-label="Filter reservations by room"><option value="all">All rooms</option></select>
              <input id="searchBookings" type="search" placeholder="Search bookings" aria-label="Search bookings" />
            </div>
          </div>
          <div id="bookingsList" class="bookings-list"></div>
        </section>
      </main>
    </div>

    <dialog id="bookingDialog" class="booking-dialog">
      <form id="bookingForm" method="dialog">
        <div class="modal-header"><div><h2>Book a room</h2></div><button class="close-button" type="button" id="closeDialog" aria-label="Close">×</button></div>
        <p class="modal-intro">Fill in the details below.</p>
        <div class="form-grid">
          <label>Meeting title<input id="meetingTitle" name="meetingTitle" maxlength="70" placeholder="e.g. Quarterly planning" /></label>
          <label>Your name<input id="organizer" name="organizer" required maxlength="50" placeholder="Your name" /></label>
          <label>Room<select id="room" name="room" required></select></label>
          <label>Date<input id="bookingDate" name="bookingDate" type="date" required /></label>
          <label>Start time<select id="startTime" name="startTime" required></select></label>
          <label>End time<select id="endTime" name="endTime" required></select></label>
        </div>
        <p id="formError" class="form-error" role="alert"></p>
        <div class="modal-footer"><button class="text-button" id="cancelDialog" type="button">Cancel</button><button class="primary-button" type="submit">Book room <span>→</span></button></div>
      </form>
    </dialog>

    <dialog id="cancelDialogBox" class="confirm-dialog">
      <div><span class="warning-icon">!</span><h2>Cancel this booking?</h2><p>This room will be free for others to book.</p><div class="confirm-actions"><button id="keepBooking" class="text-button" type="button">Keep booking</button><button id="confirmCancel" class="danger-button" type="button">Cancel booking</button></div></div>
    </dialog>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
